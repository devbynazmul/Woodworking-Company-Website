<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Rakshak - Carpentry Service</title>
    <link rel="icon" href="assets/images/header/favicon.svg">
    <link rel="stylesheet" href="assets/css/animation.css">
    <link rel="stylesheet" href="assets/css/magiccursor.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/fancybox.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/slick.css">
    <link rel="stylesheet" href="assets/css/slick-theme.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
    <!-- ====================================== Preloader ===================================== -->
    <div id="preloader"
        class="position-fixed top-0 bottom-0 start-0 end-0 d-flex align-items-center justify-content-center">
        <div class="wood-circle position-relative d-flex flex-column align-items-center justify-content-center">
            <div class="saw-blade position-absolute"></div>
            <img src="assets/images/header/favicon.svg" alt="favicon">
        </div>
    </div>
    <div class="menu-overlay position-fixed top-0 start-0 w-100 h-100"></div>
    <!-- ====================================== Coming Soon ===================================== -->
    <section class="coming-soon-section">
        <div class="container">
            <div class="coming-soon-container d-flex flex-column align-items-center align-items-lg-start">
                <div class="coming-soon-wrapper d-flex flex-column">
                    <a href="index1.html" class="mx-auto mx-lg-0">
                        <img src="assets/images/header/menu-header-logo.svg" alt="menu-header-logo">
                    </a>
                    <div
                        class="coming-soon-counter-container d-flex flex-wrap flex-sm-nowrap align-items-center justify-content-center align-items-lg-start justify-content-lg-start">
                        <div class="coming-soon-counter-box d-flex flex-column align-items-center">
                            <p id="days" class="mb-0">0</p>
                            <span>Day</span>
                        </div>
                        <div class="coming-soon-white-circle-container d-flex flex-column">
                            <div class="coming-soon-white-circle rounded-circle"></div>
                            <div class="coming-soon-white-circle rounded-circle"></div>
                        </div>
                        <div class="coming-soon-counter-box d-flex flex-column align-items-center">
                            <p id="hours" class="mb-0">0</p>
                            <span>Hours</span>
                        </div>
                        <div class="coming-soon-white-circle-container d-flex flex-column">
                            <div class="coming-soon-white-circle rounded-circle"></div>
                            <div class="coming-soon-white-circle rounded-circle"></div>
                        </div>
                        <div class="coming-soon-counter-box d-flex flex-column align-items-center">
                            <p id="minutes" class="mb-0">0</p>
                            <span>Minutes</span>
                        </div>
                        <div class="coming-soon-white-circle-container d-flex flex-column">
                            <div class="coming-soon-white-circle rounded-circle"></div>
                            <div class="coming-soon-white-circle rounded-circle"></div>
                        </div>
                        <div class="coming-soon-counter-box d-flex flex-column align-items-center">
                            <p id="seconds" class="mb-0">0</p>
                            <span>Seconds</span>
                        </div>
                    </div>
                    <div class="coming-soon-content-container">
                        <p class="our-new-website-text mb-0 text-center text-lg-start">Our New Website is -</p>
                        <div
                            class="coming-soon-heading-container d-flex flex-column flex-lg-row align-items-center align-items-lg-start">
                            <h1 class="mb-0 text-center text-lg-start">Coming Soon Stay Tuned!</h1>
                            <div
                                class="coming-soon-heading-right-container d-flex flex-column align-items-center align-items-lg-start">
                                <div
                                    class="circular-text-main d-flex align-items-center justify-content-center rounded-circle">
                                    <svg class="circular-text" viewBox="0 0 200 200">
                                        <defs>
                                            <path id="circlePath"
                                                d="M 100,100 m -75,0 a 75,75 0 1,1 150,0 a 75,75 0 1,1 -150,0">
                                            </path>
                                        </defs>
                                        <text>
                                            <textPath href="#circlePath">15+ Years Excellence * 15+ Years Excellence *
                                            </textPath>
                                        </text>
                                    </svg>
                                </div>
                                <p class="mb-0 text-center text-lg-start">We are a premier Carpentry Company
                                    specializing in custom woodwork and
                                    handcrafted furniture design.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="coming-soon-social-icons-container d-flex flex-column flex-sm-row align-items-center">
                    <div class="footer-social-icons d-flex align-items-center position-relative">
                        <a href="https://www.facebook.com/" target="_blank"
                            class="d-flex align-items-center justify-content-center rounded-circle">
                            <img src="assets/images/footer/facebook.svg" alt="facebook">
                        </a>
                        <a href="https://www.instagram.com/" target="_blank"
                            class="d-flex align-items-center justify-content-center rounded-circle position-absolute footer-instagram-icon">
                            <img src="assets/images/footer/instagram.svg" alt="instagram">
                        </a>
                        <a href="https://x.com/" target="_blank"
                            class="d-flex align-items-center justify-content-center rounded-circle position-absolute footer-x-icon">
                            <img src="assets/images/footer/x.svg" alt="x-icon">
                        </a>
                        <a href="https://www.linkedin.com/" target="_blank"
                            class="d-flex align-items-center justify-content-center rounded-circle position-absolute footer-linkedin-icon">
                            <img src="assets/images/footer/linked-in.svg" alt="linked-in">
                        </a>
                    </div>
                    <div class="coming-soon-hr-line"></div>
                    <a href="index1.html"
                        class="get-free-quote-btn position-relative explore-our-services-btn notify-me-btn">
                        <span class="btn-main position-absolute start-0 w-100">
                            <span class="btn-text one d-flex align-items-center justify-content-center">Notify Me</span>
                            <span class="btn-text two d-flex align-items-center justify-content-center">Notify Me</span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </section>
    <!-- ====================================== Bottom To Top Button ===================================== -->
    <div id="scrollToTop">
        <svg class="progress-ring position-absolute" width="60" height="60">
            <circle class="progress-ring__circle" stroke="#EAE5E0" stroke-width="4" fill="transparent" r="26" cx="30"
                cy="30">
            </circle>
        </svg>
        <img src="assets/images/footer/footer-arrow.svg" alt="bottom-to-top-arrow"
            class="bottom-to-top-arrow position-relative">
    </div>
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/smooth-scrolling.js"></script>
    <script src="assets/js/magiccursor.js"></script>
    <script src="assets/js/fancybox.umd.js"></script>
    <script src="assets/js/slick.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
